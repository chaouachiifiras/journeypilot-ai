# Codemagic CI — iOS build of the Capacitor app, signed and sent to TestFlight.
#
# No secrets in this file:
#   - code signing and the TestFlight upload use the App Store Connect API key
#     integration configured in the Codemagic UI (Team settings → Integrations);
#   - build-time values (public Supabase / Google Maps / RevenueCat keys, Apple
#     app id) come from the "journeypilot_ios" environment group, also set in
#     the Codemagic UI.
# The iOS platform (ios/) is committed; `cap sync ios` refreshes the web bundle
# and the Swift packages on the build machine.

workflows:
  # Unsigned IPA for testing on a personal iPhone without a paid Apple Developer
  # account: sign + install it from Windows with Sideloadly and a free Apple ID
  # (the app then expires after 7 days; in-app purchases do not work).
  ios-unsigned:
    name: iOS → IPA non signée (test Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      groups:
        - journeypilot_ios
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest

    scripts:
      - name: Install Bun
        script: |
          curl -fsSL https://bun.sh/install | bash
          echo "PATH=$HOME/.bun/bin:$PATH" >> "$CM_ENV"

      - name: Install dependencies
        script: bun install --frozen-lockfile

      - name: Build the mobile web bundle
        script: bun run build:mobile

      - name: Sync the iOS platform
        script: ./node_modules/.bin/cap sync ios

      - name: Build the unsigned app
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package the IPA
        script: |
          mkdir -p build/ipa/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa && zip -qry JourneyPilot-AI-unsigned.ipa Payload

    artifacts:
      - build/ipa/*.ipa

  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Must match the name given to the App Store Connect API key in Codemagic.
      app_store_connect: JourneyPilot App Store Connect

    environment:
      groups:
        - journeypilot_ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.journeypilot.ai
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest

    scripts:
      - name: Install Bun
        script: |
          curl -fsSL https://bun.sh/install | bash
          echo "PATH=$HOME/.bun/bin:$PATH" >> "$CM_ENV"

      - name: Install dependencies
        script: bun install --frozen-lockfile

      - name: Build the mobile web bundle
        # Same command as for Android (it also refreshes android/, harmless here).
        script: bun run build:mobile

      - name: Sync the iOS platform
        script: ./node_modules/.bin/cap sync ios

      - name: Set up code signing
        # Fetches/creates the App Store certificate and provisioning profile
        # through the App Store Connect integration, then applies them.
        script: xcode-project use-profiles

      - name: Build the signed IPA
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          BUILD_NUMBER=$((LATEST + 1))
          echo "TestFlight build number: $BUILD_NUMBER"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
